[project]
name = "tabfree-cli"
version = "0.0.1"
description = "The tabfree command: sign in, pull and push dashboard drafts, and the Claude Code kit."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Standard library only: it talks to a TabFree server's MCP endpoint and OAuth server.
dependencies = []

[project.scripts]
tabfree = "tabfree_cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabfree_cli"]
