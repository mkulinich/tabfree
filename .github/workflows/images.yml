name: images

# BUILD_PLAN P7.5: build the API image (infra/docker/api), push it to GitHub Container Registry, sign it
# with Sigstore keyless signing (the workflow's OIDC identity; no keys stored), and attach an SBOM and
# build provenance as signed attestations. Verify before deploying:
#
#   cosign verify ghcr.io/<owner>/tabfree-api@sha256:<digest> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/images.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Like the package releases, nothing is pushed until the public name has cleared (PUBLIC_NAME_CLEARED).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    if: vars.PUBLIC_NAME_CLEARED == 'true'
    runs-on: ubuntu-latest
    environment: images
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tabfree-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api/Dockerfile
          build-args: EXTRAS=aws ai render
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM (CycloneDX) as a signed attestation
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Vulnerability scan of the pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
