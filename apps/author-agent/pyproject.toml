[project]
name = "tabfree-author-agent"
version = "0.0.1"
description = "The 'Edit with Claude' sandbox: the Claude Agent SDK working on one TabFree draft over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Not a uv workspace member: the Agent SDK runs under Anthropic's terms (ADR-008), and this package
# ships only in the author container image. The orchestration below is tested without the SDK.
dependencies = ["claude-agent-sdk>=0.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabfree_author_agent"]
