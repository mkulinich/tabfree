[project]
name = "tabfree-api"
version = "0.0.1"
description = "TabFree API service: auth, permissions, content and the governed query API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "tabfree-compiler",
  "tabfree-schemas",
]

[project.optional-dependencies]
# The local dashboard preview runs queries on DuckDB over generated sample data.
preview = ["duckdb>=1.1"]

[tool.uv.sources]
tabfree-compiler = { workspace = true }
tabfree-schemas = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabfree_api"]
