[project]
name = "tabfree-api"
version = "0.0.1"
description = "TabFree API service: auth, permissions, content and the governed query API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "tabfree-compiler",
  "tabfree-schemas",
  "pyjwt[crypto]>=2.9",
  # Explore queries are checked against the manifest schema's query definition.
  "jsonschema>=4.23",
  # P3.1: metadata in Postgres (Aurora PostgreSQL in AWS), migrations with Alembic.
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  # P3.2: local account passwords.
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# The local dashboard preview runs queries on DuckDB over generated sample data.
preview = ["duckdb>=1.1"]
aws = [
    "boto3>=1.35",
]

[tool.uv.sources]
tabfree-compiler = { workspace = true }
tabfree-schemas = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabfree_api"]
