# Iceberg catalog: the local stand-in for Athena's AwsDataCatalog.
# Metadata lives in the Iceberg REST catalog (service iceberg-rest); data files
# live in the S3-compatible object store (service objectstore).
# Property names verified against Trino 484. Trino refuses to start on an
# unknown property, so check the docs before adding one.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.security=NONE

# Match what Athena engine v3 writes (ADR-007: Iceberg v2, Parquet).
iceberg.format-version=2
iceberg.file-format=PARQUET

# Native S3 file system against the local object store.
fs.s3.enabled=true
s3.endpoint=http://objectstore:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TABFREE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TABFREE_S3_SECRET_KEY}
