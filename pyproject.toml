# Workspace root (virtual: not itself a package). Each member has its own pyproject.toml.

[tool.uv.workspace]
members = ["packages/schemas", "packages/compiler", "packages/migrate", "apps/api"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx2",
  "types-PyYAML>=6.0",
  "types-defusedxml>=0.7",
  "types-jsonschema>=4.23",
  "duckdb>=2.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["corpus", "third_party", "infra", "node_modules", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "N"]

[tool.ruff.lint.isort]
known-first-party = ["tabfree_api", "tabfree_compiler", "tabfree_migrate", "tabfree_schemas"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and use obviously fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]
# Hyper SQL is built from catalog names, always quoted; the files themselves are the input.
"packages/migrate/src/tabfree_migrate/hyper.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["packages/schemas/src", "packages/compiler/src", "packages/migrate/src", "apps/api/src"]

[[tool.mypy.overrides]]
module = ["tableauserverclient", "tableauserverclient.*", "tableauhyperapi", "tableauhyperapi.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/schemas/tests", "packages/compiler/tests", "packages/migrate/tests", "apps/api/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: needs a real Tableau Server or AWS account; skipped unless enabled"]
